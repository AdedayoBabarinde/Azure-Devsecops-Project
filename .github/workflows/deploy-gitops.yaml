name: GitOps - Build and Push to ACR

on:
  push:
    branches:
      - main
      - add-github-action-workflows
    paths:
      - 'app/**'
      - '.github/workflows/deploy-gitops.yaml'

permissions:
  contents: write  # Need write permission to commit updated manifests
  security-events: write

jobs:
  # Job 1: Code Security Scan
  code-security:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: ./app
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check SonarCloud Quality Gate
        run: |
          echo "✅ SonarCloud scan completed"

  # Job 2: Build, Scan, and Push Image
  build-and-scan:
    name: Build Docker Image & Security Scan
    runs-on: ubuntu-latest
    needs: code-security
    outputs:
      image_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        id: set_tag
        run: |
          # Use git SHA as image tag for traceability
          TAG="v1.0.${{ github.run_number }}-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using image tag: ${TAG}"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure CLI - Log in to ACR
        run: |
          az acr login --name nimbusacrdev001

      - name: Build Docker image
        run: |
          docker build -t nimbusacrdev001.azurecr.io/nimbus-app:${{ steps.set_tag.outputs.tag }} ./app
          docker tag nimbusacrdev001.azurecr.io/nimbus-app:${{ steps.set_tag.outputs.tag }} nimbusacrdev001.azurecr.io/nimbus-app:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nimbusacrdev001.azurecr.io/nimbus-app:${{ steps.set_tag.outputs.tag }}
          format: table
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Run Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nimbusacrdev001.azurecr.io/nimbus-app:${{ steps.set_tag.outputs.tag }}
          format: sarif
          output: trivy-results.sarif

      - name: Push Docker images to ACR
        run: |
          docker push nimbusacrdev001.azurecr.io/nimbus-app:${{ steps.set_tag.outputs.tag }}
          docker push nimbusacrdev001.azurecr.io/nimbus-app:latest

  # Job 3: Update Kubernetes Manifests (GitOps)
  update-manifests:
    name: Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment manifest
        run: |
          sed -i "s|image: nimbusacrdev001.azurecr.io/nimbus-app:.*|image: nimbusacrdev001.azurecr.io/nimbus-app:${{ needs.build-and-scan.outputs.image_tag }}|" k8s/deployment.yaml
          cat k8s/deployment.yaml | grep "image:"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image to ${{ needs.build-and-scan.outputs.image_tag }} [skip ci]" || echo "No changes to commit"
          git push

  # Job 4: Verify ArgoCD Sync (Optional)
  verify-deployment:
    name: Verify ArgoCD Deployment
    runs-on: ubuntu-latest
    needs: update-manifests
    if: success()

    steps:
      - name: Wait for ArgoCD sync
        run: |
          echo "⏳ Waiting for ArgoCD to sync the application..."
          echo "🔗 Check ArgoCD UI: http://20.242.220.204"
          echo "📊 Application: nimbus-app"
          sleep 30  # Give ArgoCD time to detect changes

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        run: |
          az aks get-credentials --resource-group rg-nimbus-dev --name aks-nimbus-dev --overwrite-existing

      - name: Check deployment status
        run: |
          echo "🔍 Checking deployment status..."
          kubectl get deployment my-app-deployment -n dev
          kubectl get pods -n dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/my-app-deployment -n dev --timeout=5m

  # Job 5: Send Success Notification
  notify:
    name: Send Success Notification
    runs-on: ubuntu-latest
    needs: [build-and-scan, verify-deployment]
    if: success()

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ NimbusShop GitOps Deployment Successful"
          to: dbabarinde@gmail.com
          from: dbabarinde@gmail.com
          body: |
            ✅ NimbusShop GitOps deployment completed successfully!

            Security Checks:
            🔎 SonarCloud: Passed
            🔍 Trivy Scan: Passed

            Deployment:
            🚀 Image: nimbusacrdev001.azurecr.io/nimbus-app:${{ needs.build-and-scan.outputs.image_tag }}
            ☸️  Cluster: aks-nimbus-dev
            🔄 GitOps: ArgoCD

            🔗 ArgoCD Dashboard: http://20.242.220.204
            🔗 SonarCloud: https://sonarcloud.io/project/overview?id=${{ secrets.SONAR_PROJECT_KEY }}
            🔗 GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
